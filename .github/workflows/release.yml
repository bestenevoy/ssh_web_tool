name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 推送 v 开头的 tag 时触发，如 v0.1.0
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 允许创建 Release 和上传资产

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      # 收集 VC++ 运行时 DLL（vcruntime140.dll 等），确保干净 Windows 也能加载 winpty.dll
      - name: Collect VC++ runtime DLLs
        shell: powershell
        run: |
          $pyDir = Split-Path -Parent (Get-Command python).Source
          # 目录必须无条件创建：--add-data "vcrt;." 在目录不存在时会让 PyInstaller 直接失败
          New-Item -ItemType Directory -Force -Path vcrt | Out-Null
          $dlls = Get-ChildItem -Path $pyDir -Filter "vcruntime*.dll" -ErrorAction SilentlyContinue
          $dlls += Get-ChildItem -Path $pyDir -Filter "msvcp*.dll" -ErrorAction SilentlyContinue
          if ($dlls) {
            foreach ($dll in $dlls) {
              Copy-Item $dll.FullName vcrt\
              Write-Host "Found: $($dll.Name)"
            }
          } else {
            Write-Host "No VC++ runtime DLLs found in Python dir"
          }

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name "SSHWebTool" --add-data "static;static" --add-data "config.example.json;." --add-data "vcrt;." --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "uvicorn.lifespan" --hidden-import "uvicorn.lifespan.on" --collect-submodules "asyncssh" --collect-all "winpty" --exclude-module "playwright" main.py

      - name: Verify EXE
        run: |
          if (Test-Path "dist/SSHWebTool.exe") {
            $size = (Get-Item "dist/SSHWebTool.exe").Length / 1MB
            Write-Host "EXE built successfully, size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "EXE not found!"
            exit 1
          }
        shell: powershell

      # 回归防线：v0.1.36 曾因 Actions 环境没装 pywinpty 导致 EXE 内完全没有 winpty 包，
      # --collect-all winpty 收集了个寂寞，运行时本地终端报"需要安装 pywinpty"。
      # 构建产物必须包含 winpty.dll/_winpty.pyd，否则直接构建失败。
      - name: Verify winpty bundled
        run: |
          $out = python -m PyInstaller.utils.cliutils.archive_viewer -l dist/SSHWebTool.exe 2>&1 | Out-String
          if ($out -match 'winpty') {
            $n = ([regex]::Matches($out, 'winpty')).Count
            Write-Host "winpty bundled OK (matches: $n)"
          } else {
            Write-Error "winpty NOT bundled in EXE! pywinpty missing from build env."
            exit 1
          }
          # 额外验证关键 DLL/扩展模块
          $critical = @('winpty.dll', '_winpty', 'vcruntime')
          foreach ($pat in $critical) {
            if ($out -match $pat) {
              Write-Host "  [OK] $pat found in archive"
            } else {
              Write-Warning "  [WARN] $pat NOT found in archive"
            }
          }
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSHWebTool-Windows
          path: dist/SSHWebTool.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SSHWebTool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile --name "ssh-web-tool" --add-data "static:static" --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "uvicorn.lifespan" --hidden-import "uvicorn.lifespan.on" --collect-submodules "asyncssh" --exclude-module "playwright" main.py

      - name: Verify binary
        run: |
          if [ -f "dist/ssh-web-tool" ]; then
            echo "Binary built successfully"
            ls -lh dist/ssh-web-tool
          else
            echo "Binary not found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSHWebTool-Linux
          path: dist/ssh-web-tool
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ssh-web-tool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
