name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 推送 v 开头的 tag 时触发，如 v0.1.0
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 允许创建 Release 和上传资产

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name "SSHWebTool" --add-data "static;static" --add-data "config.example.json;." --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "uvicorn.lifespan" --hidden-import "uvicorn.lifespan.on" --collect-submodules "asyncssh" --exclude-module "playwright" main.py

      - name: Verify EXE
        run: |
          if (Test-Path "dist/SSHWebTool.exe") {
            $size = (Get-Item "dist/SSHWebTool.exe").Length / 1MB
            Write-Host "EXE built successfully, size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "EXE not found!"
            exit 1
          }
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSHWebTool-Windows
          path: dist/SSHWebTool.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SSHWebTool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile --name "ssh-web-tool" --add-data "static:static" --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "uvicorn.lifespan" --hidden-import "uvicorn.lifespan.on" --collect-submodules "asyncssh" --exclude-module "playwright" main.py

      - name: Verify binary
        run: |
          if [ -f "dist/ssh-web-tool" ]; then
            echo "Binary built successfully"
            ls -lh dist/ssh-web-tool
          else
            echo "Binary not found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSHWebTool-Linux
          path: dist/ssh-web-tool
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ssh-web-tool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-gitee:
    name: Publish to Gitee Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') && secrets.GITEE_TOKEN != ''
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Push tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git remote add gitee "https://lookingstars:${GITEE_TOKEN}@gitee.com/lookingstars/ssh_web_tool.git"
          git push gitee "${TAG}" 2>&1 | tail -3

      - name: Create/Update Gitee Release and upload assets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          API="https://gitee.com/api/v5/repos/lookingstars/ssh_web_tool"
          TOKEN="$GITEE_TOKEN"
          # 查询该 tag 是否已有发行版
          HTTP=$(curl -s -o /tmp/release.json -w "%{http_code}" "$API/releases/tags/$TAG?access_token=$TOKEN" || true)
          if [ "$HTTP" = "200" ]; then
            REL_ID=$(python3 -c "import json;print(json.load(open('/tmp/release.json'))['id'])")
            echo "发行版已存在 id=$REL_ID"
          else
            curl -s -X POST "$API/releases" -H "Content-Type: application/json" \
              -d "{\"access_token\":\"$TOKEN\",\"tag_name\":\"$TAG\",\"name\":\"Release $TAG\",\"body\":\"由 GitHub Actions 自动发布\",\"prerelease\":false}" \
              -o /tmp/release.json
            REL_ID=$(python3 -c "import json;print(json.load(open('/tmp/release.json'))['id'])")
            echo "发行版已创建 id=$REL_ID"
          fi
          # 上传附件（EXE / Linux 二进制）
          for f in $(find assets -type f); do
            echo "上传附件: $f ($(du -h "$f" | cut -f1))"
            curl -s -X POST "$API/releases/$REL_ID/attach_files?access_token=$TOKEN" \
              -F "file=@$f" -o /tmp/up.json
            python3 -c "import json;d=json.load(open('/tmp/up.json'));print('  完成:', d.get('name', d))" 2>/dev/null || cat /tmp/up.json
          done
