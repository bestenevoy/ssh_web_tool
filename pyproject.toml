[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-web-tool"
version = "0.1.0"
description = "网页版 SSH 连接管理工具 - 类似 Xshell 的 Web UI，支持 Python 库嵌入式使用、CLI/HTTP API 调用、存储阵列管理页面自动登录"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "bestenevoy" },
]
keywords = ["ssh", "web", "terminal", "xshell", "paramiko", "asyncssh", "sftp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]
dependencies = [
    "asyncssh>=2.20.0",
    "fastapi>=0.110.0",
    "playwright>=1.40.0",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
]
# 劫持 paramiko / asyncssh 已有代码时安装（pip install -e ".[monkeypatch]"）
monkeypatch = [
    "paramiko>=3.0",
]

[project.scripts]
ssh-web-tool = "main:main"
ssh-client = "ssh_client:main"

[project.urls]
Homepage = "https://github.com/bestenevoy/ssh_web_tool"
Repository = "https://github.com/bestenevoy/ssh_web_tool"
Issues = "https://github.com/bestenevoy/ssh_web_tool/issues"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]

[tool.setuptools]
packages = ["ssh_web_tool"]
py-modules = ["main", "ssh_client"]

[tool.setuptools.package-data]
ssh_web_tool = ["*.py"]

[tool.setuptools.data-files]
"static" = ["static/index.html"]
