[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-monkeypatch"
version = "0.1.0"
description = "Monkey-patch 劫持当前进程内所有 paramiko / asyncssh SSH 连接，自动登记连接状态（可选桥接到 ssh_web_tool 镜像会话）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "bestenevoy" }]
keywords = ["ssh", "paramiko", "asyncssh", "monkey-patch", "hijack"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
# paramiko / asyncssh 为可选依赖：只劫持已安装的库
[project.optional-dependencies]
paramiko = ["paramiko>=2.0"]
asyncssh = ["asyncssh>=2.0"]
all = ["paramiko>=2.0", "asyncssh>=2.0"]
# 可选桥接：把登记同步到 ssh_web_tool 的镜像会话（Web UI 可见）
web = ["ssh_web_tool>=0.1.6"]

[tool.setuptools.packages.find]
where = ["src"]
